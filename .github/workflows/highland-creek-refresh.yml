name: Highland Creek data refresh

# Deterministic county-sales refresh. No agent, no judgement: scripts/refresh_highland_creek.py
# pulls Mecklenburg County GIS records, the normal build + AEO validation gate the result,
# and Discord (#site-updates) is notified ONLY when the refresh fails or the live page
# does not reflect the refreshed data.
on:
  schedule:
    - cron: '0 13 1,15 * *'   # 09:00 EDT / 08:00 EST on the 1st and 15th
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  deployments: read

concurrency:
  group: highland-creek-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail {0}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Check baseline and county contracts
        run: |
          test "$(git branch --show-current)" = main
          test "$(git remote)" = origin
          case "$(git remote get-url origin)" in
            https://github.com/ingadraper/ingadraper.github.io|https://github.com/ingadraper/ingadraper.github.io.git) ;;
            *) echo 'HC_UNEXPECTED_ORIGIN'; exit 1 ;;
          esac
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          python3 -m unittest discover -s scripts -p test_refresh_highland_creek.py -v
      - name: Fetch county data
        id: fetch
        run: |
          python3 scripts/refresh_highland_creek.py | tee "$RUNNER_TEMP/hc-fetch.log"
          grep -E '^(CHANGED|ASOF)=' "$RUNNER_TEMP/hc-fetch.log" >> "$GITHUB_OUTPUT"
      - name: Build and validate
        run: |
          npm ci
          npm run build
          npm run validate:aeo
          python3 scripts/refresh_highland_creek.py --verify-html dist/highland-creek/index.html
          git diff --check
      - name: Commit and publish
        if: steps.fetch.outputs.CHANGED == 'true'
        run: |
          git config user.name "highland-creek-refresh"
          git config user.email "actions@users.noreply.github.com"
          test "$(git diff --name-only)" = src/data/highland-creek-market.json
          test -z "$(git ls-files --others --exclude-standard)"
          test -z "$(git diff --cached --name-only)"
          git add src/data/highland-creek-market.json
          test "$(git diff --cached --name-only)" = src/data/highland-creek-market.json
          git diff --cached --check
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          git commit -m "Refresh Highland Creek county sales through ${{ steps.fetch.outputs.ASOF }}"
          git push origin HEAD:main
      - name: Deploy exact main and wait for its run
        run: |
          test -z "$(git status --porcelain)"
          SHA=$(git rev-parse HEAD)
          test "$SHA" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          SINCE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run deploy.yml --ref main
          RUN_ID=''
          for attempt in 1 2; do
            sleep 10
            RUN_ID=$(gh run list --workflow deploy.yml --event workflow_dispatch --commit "$SHA" --limit 10 --json databaseId,createdAt --jq "[.[] | select(.createdAt >= \"$SINCE\")][0].databaseId // empty")
            if [ -n "$RUN_ID" ]; then break; fi
          done
          test -n "$RUN_ID" || { echo 'HC_DEPLOY_RUN_NOT_FOUND'; exit 1; }
          timeout 15m gh run watch "$RUN_ID" --exit-status
          test "$SHA" = "$(gh run view "$RUN_ID" --json headSha --jq .headSha)"
          echo "HC_CANDIDATE_SHA=$SHA" >> "$GITHUB_ENV"
      - name: Verify exact deployment and complete live county payload
        run: |
          test "$HC_CANDIDATE_SHA" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          for attempt in 1 2; do
            if python3 scripts/refresh_highland_creek.py --verify-live --sha "$HC_CANDIDATE_SHA"; then exit 0; fi
            if [ "$attempt" = 1 ]; then sleep 30; fi
          done
          echo 'HC_EXACT_LIVE_VERIFICATION_FAILED'; exit 1
      - name: Alert Discord (#site-updates)
        if: failure()
        env:
          HOOK: ${{ secrets.SITE_UPDATES_WEBHOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "SITE_UPDATES_WEBHOOK not set; relying on GitHub failure notification"; exit 0; fi
          MSG="Highland Creek county refresh failed: inspect the named failing step (source, build, publish, deployment or exact live payload). ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -fsS -H 'Content-Type: application/json' -d "$(python3 -c 'import json,sys;print(json.dumps({"content":sys.argv[1]}))' "$MSG")" "$HOOK"
